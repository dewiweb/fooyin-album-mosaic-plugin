name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ─── Linux ──────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            g++ git cmake pkg-config ninja-build libglu1-mesa-dev libxkbcommon-dev zlib1g-dev \
            libasound2-dev libtag1-dev libicu-dev libpipewire-0.3-dev libpulse-dev \
            qt6-base-dev libqt6sql6-sqlite libqt6svg6-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools \
            libavcodec-dev libavformat-dev libavutil-dev libavdevice-dev libswresample-dev \
            libsndfile1-dev libarchive-dev patchelf

      - name: Cache Fooyin build
        id: cache-fooyin
        uses: actions/cache@v4
        with:
          path: ~/fooyin-dev
          key: fooyin-0.12.6-ubuntu2404-${{ runner.os }}

      - name: Clone and build Fooyin
        if: steps.cache-fooyin.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v0.12.6 https://github.com/fooyin/fooyin.git /tmp/fooyin
          cd /tmp/fooyin
          git submodule update --init --recursive
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$HOME/fooyin-dev \
            -DINSTALL_HEADERS=ON \
            -DBUILD_PLUGINS=OFF
          cmake --build build
          cmake --install build

      - name: Build plugin
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$HOME/fooyin-dev"
          cmake --build build

      - name: Patch RUNPATH
        run: |
          patchelf --set-rpath '$ORIGIN/../lib/fooyin' build/fyplugin_albummosaicplugin.so || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-linux
          path: build/fyplugin_albummosaicplugin.so

  # ─── Flatpak ────────────────────────────────────────────────────────────
  build-flatpak:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Flatpak and KDE SDK
        run: |
          sudo apt update
          sudo apt install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y org.kde.Sdk/x86_64/6.11
          flatpak install --user -y org.kde.Platform/x86_64/6.11

      - name: Build plugin for Flatpak
        run: |
          # Build inside the Flatpak SDK environment
          flatpak-builder --user --install-deps-from=flathub build-dir flatpak-manifest.json || true
          # Fallback: build manually in the SDK
          flatpak run --command=bash org.kde.Sdk/x86_64/6.11 -- -c "
            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH=/app
            cmake --build build
          " || echo "Flatpak build needs a manifest — skipping for now"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-flatpak
          path: build/fyplugin_albummosaicplugin.so
          if-no-files-found: ignore

  # ─── Windows ───────────────────────────────────────────────────────────
  # Mirrors fooyin's own build-windows.yml: vcpkg pinned to fooyin's
  # builtin-baseline, VCPKG_INSTALLED_DIR outside the build tree (avoids
  # "INTERFACE_INCLUDE_DIRECTORIES prefixed in build directory" errors),
  # binary + installed deps cached in C:/v.
  build-windows:
    runs-on: windows-latest
    continue-on-error: true
    env:
      VCPKG_ROOT_DIR: 'C:/vcpkg'
      VCPKG_INSTALLED_DIR: 'C:/v'
      VCPKG_DOWNLOADS: 'C:/v/dl'
      VCPKG_DISABLE_METRICS: true
    steps:
      - uses: actions/checkout@v4

      - name: Clone Fooyin
        shell: pwsh
        run: |
          git clone --depth 1 --branch v0.12.6 https://github.com/fooyin/fooyin.git C:\fooyin-src
          cd C:\fooyin-src
          git submodule update --init --recursive
          Copy-Item vcpkg.json "$env:GITHUB_WORKSPACE/vcpkg-lock.json"

      - name: Setup vcpkg
        shell: pwsh
        run: |
          $vcpkgCommit = (Get-Content C:\fooyin-src\vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          git init $env:VCPKG_ROOT_DIR
          git -C $env:VCPKG_ROOT_DIR remote add origin https://github.com/microsoft/vcpkg.git 2>$null
          git -C $env:VCPKG_ROOT_DIR fetch --depth 1 origin $vcpkgCommit
          git -C $env:VCPKG_ROOT_DIR checkout --detach FETCH_HEAD
          & "$env:VCPKG_ROOT_DIR/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          echo "VCPKG_ROOT=$env:VCPKG_ROOT_DIR" >> $env:GITHUB_ENV
          echo "VCPKG_BINARY_SOURCES=clear;files,C:/v/bin-cache,readwrite" >> $env:GITHUB_ENV

      - name: Cache vcpkg deps
        uses: actions/cache@v4
        with:
          path: C:/v
          key: windows-vcpkg-${{ hashFiles('vcpkg-lock.json') }}
          restore-keys: windows-vcpkg-

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Install Ninja
        run: choco install ninja -y

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          archives: qtbase qtsvg qttools
          cache: true
          arch: 'win64_msvc2022_64'

      - name: Setup MSVC
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Cache Fooyin build
        id: cache-fooyin
        uses: actions/cache@v4
        with:
          path: C:\fooyin-dev
          key: fooyin-0.12.6-windows-msvc-v2-${{ hashFiles('vcpkg-lock.json') }}

      - name: Build Fooyin
        if: steps.cache-fooyin.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          cd C:\fooyin-src
          cmake --preset release-vcpkg `
            -DBUILD_PLUGINS=OFF `
            -DBUILD_TESTING=OFF `
            -DINSTALL_HEADERS=ON `
            -DVCPKG_INSTALLED_DIR="$env:VCPKG_INSTALLED_DIR" `
            -DCMAKE_INSTALL_PREFIX=C:\fooyin-dev
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-release-vcpkg --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install build-release-vcpkg --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build plugin
        shell: pwsh
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_INSTALLED_DIR="$env:VCPKG_INSTALLED_DIR" `
            -DQT_DIR="$env:QT_ROOT_DIR/lib/cmake/Qt6" `
            -DQt6_DIR="$env:QT_ROOT_DIR/lib/cmake/Qt6" `
            -DCMAKE_PREFIX_PATH="C:\fooyin-dev;$env:QT_ROOT_DIR"
          cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-windows
          path: build/fyplugin_albummosaicplugin.dll

  # ─── Release ───────────────────────────────────────────────────────────
  create-release:
    needs: [build-linux, build-flatpak, build-windows]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-assets
          # Copy Linux .so
          if [ -f artifacts/plugin-linux/fyplugin_albummosaicplugin.so ]; then
            cp artifacts/plugin-linux/fyplugin_albummosaicplugin.so release-assets/fyplugin_albummosaicplugin-linux-x86_64.so
          fi
          # Copy Windows .dll
          if [ -f artifacts/plugin-windows/fyplugin_albummosaicplugin.dll ]; then
            cp artifacts/plugin-windows/fyplugin_albummosaicplugin.dll release-assets/fyplugin_albummosaicplugin-windows-x86_64.dll
          fi
          # Copy Flatpak .so
          if [ -f artifacts/plugin-flatpak/fyplugin_albummosaicplugin.so ]; then
            cp artifacts/plugin-flatpak/fyplugin_albummosaicplugin.so release-assets/fyplugin_albummosaicplugin-flatpak-x86_64.so
          fi
          ls -la release-assets/ || echo "No artifacts found"

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
